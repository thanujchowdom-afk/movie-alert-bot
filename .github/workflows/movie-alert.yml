name: Movie Alert Bot

on:
  schedule:
    - cron: "*/10 * * * *"        # every 10 minutes (GitHub may run it a bit late)
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        default: normal
        options: [normal, test, dry-run, reset]

permissions:
  contents: write

concurrency:
  group: movie-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check District
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MODE: ${{ github.event.inputs.mode || 'normal' }}
        run: python cloud_movie_bot.py

      - name: Save state
        if: always()
        run: |
          git config user.name "movie-bot"
          git config user.email "movie-bot@users.noreply.github.com"
          git add -A state.json || true
          if git diff --cached --quiet; then
            echo "State unchanged"
          else
            git commit -m "Update bot state"
            git push
          fi
